name: Update composer.lock

# Ruční spuštění (workflow_dispatch): vygeneruje composer.lock na PHP 8.4
# a commitne ho zpět do větve, která workflow spustila.
# composer.lock se lokálně negeneruje (prostředí chatů nemá přístup k balíčkům z GitHubu).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Update dependencies
        run: composer update --no-interaction --no-progress --no-scripts --prefer-dist

      - name: Commit composer.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if git diff --cached --quiet; then
            echo "composer.lock je beze změny."
          else
            git commit -m "chore: update composer.lock"
            git push
          fi
