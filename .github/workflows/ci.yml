name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: |
          set +e
          out=$(vendor/bin/pest --colors=never 2>&1); code=$?
          echo "::error title=PESTOUT::$(echo "$out" | sed 's/\x1b\[[0-9;]*m//g' | grep -v '✓' | head -c 7000 | tr '\n' '~')"
          exit $code

      - name: Sample PDF
        # Ukázková faktura z pevných dat, ke kontrole vzhledu (artifact invoice-sample-pdf).
        env:
          CACHE_STORE: array
        run: |
          mkdir -p sample-pdf
          php artisan app:sample-pdf sample-pdf/faktura.pdf
          php artisan app:sample-pdf sample-pdf/faktura-hotove.pdf --cash
          php artisan app:sample-pdf sample-pdf/faktura-60-polozek.pdf --items=60

      - name: Sample PDF s písmy DM Sans a DM Mono
        # Náhled zamýšleného vzhledu, dokud nejsou v resources/fonts brandová písma.
        # Jen pro artifact, do repozitáře se nic nepřidává; selhání nic neblokuje.
        continue-on-error: true
        env:
          CACHE_STORE: array
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/fonts" @expo-google-fonts/dm-sans @expo-google-fonts/dm-mono
          F="$RUNNER_TEMP/fonts/node_modules/@expo-google-fonts"
          mkdir -p resources/fonts
          cp "$F/dm-sans/400Regular/DMSans_400Regular.ttf" resources/fonts/DMSans-Regular.ttf
          cp "$F/dm-sans/700Bold/DMSans_700Bold.ttf" resources/fonts/DMSans-Bold.ttf
          cp "$F/dm-sans/400Regular_Italic/DMSans_400Regular_Italic.ttf" resources/fonts/DMSans-Italic.ttf
          cp "$F/dm-sans/700Bold_Italic/DMSans_700Bold_Italic.ttf" resources/fonts/DMSans-BoldItalic.ttf
          cp "$F/dm-mono/400Regular/DMMono_400Regular.ttf" resources/fonts/DMMono-Regular.ttf
          php artisan app:sample-pdf sample-pdf/faktura-dm-sans.pdf
          rm -f resources/fonts/*.ttf

      - name: Sample PDF jako PNG
        continue-on-error: true
        run: |
          for f in sample-pdf/*.pdf; do pdftoppm -r 80 -png "$f" "${f%.pdf}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-sample-pdf
          path: sample-pdf/
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
