name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Pest
        run: |
          rc=0
          for i in $(seq 1 20); do
            PEST_ITER=$i vendor/bin/pest --log-junit storage/logs/junit-$(printf %02d $i).xml >/dev/null 2>&1 || rc=1
          done
          exit $rc

      - name: Padlé testy jako anotace
        # Logy z Actions nejdou stáhnout, anotace přes API ano.
        if: failure()
        run: php scripts/ci-junit-errors.php storage/logs/junit-*.xml

      - name: Sample PDF
        # Ukázková faktura z pevných dat, ke kontrole vzhledu (artifact invoice-sample-pdf).
        env:
          CACHE_STORE: array
        run: |
          mkdir -p sample-pdf
          php artisan app:sample-pdf sample-pdf/faktura.pdf
          php artisan app:sample-pdf sample-pdf/faktura-hotove.pdf --cash
          php artisan app:sample-pdf sample-pdf/faktura-60-polozek.pdf --items=60

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-sample-pdf
          path: sample-pdf/
          if-no-files-found: error

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
